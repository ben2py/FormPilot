[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "formpilot-agent"
version = "0.4.0"
description = "A privacy-aware LLM form-filling agent with browser tools and a local web console."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=2.7.0,<3",
  "playwright>=1.50,<2",
  "ddddocr>=1.5,<2",
  "pypdf>=5.0,<7",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
formpilot = "formpilot.cli:main"
formpilot-web = "formpilot.web.app:main"

[tool.setuptools.packages.find]
include = ["formpilot*"]

[tool.setuptools.package-data]
formpilot = ["web/static/*"]
