[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "formpilot-agent"
version = "0.3.0"
description = "A privacy-aware LLM form-filling agent with browser tools."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=2.7.0,<3",
  "playwright>=1.50,<2"
]

[project.scripts]
formpilot = "formpilot.cli:main"

[tool.setuptools.packages.find]
include = ["formpilot*"]
