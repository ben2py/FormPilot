<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FormPilot 研究生报名演示</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; color: #202036; background: #f2f4f8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; }
      header { padding: 28px max(24px, calc((100% - 880px) / 2)); color: white; background: linear-gradient(115deg, #243b78, #596db3); }
      header h1 { margin: 0; font-size: 25px; } header p { margin: 8px 0 0; opacity: .75; }
      main { max-width: 880px; margin: 28px auto; padding: 0 24px 60px; }
      form { padding: 30px; border-radius: 16px; background: white; box-shadow: 0 12px 32px rgba(36, 49, 89, .1); }
      fieldset { margin: 0 0 26px; padding: 0; border: 0; }
      legend { width: 100%; margin-bottom: 18px; padding-bottom: 10px; border-bottom: 1px solid #e8eaf0; color: #31477f; font-size: 17px; font-weight: 700; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
      label { display: flex; flex-direction: column; gap: 7px; color: #53576b; font-size: 13px; }
      input, select { height: 42px; padding: 0 12px; border: 1px solid #ced2dd; border-radius: 8px; color: #202036; background: white; }
      input:focus, select:focus { border-color: #5e6fb4; outline: 3px solid rgba(85, 106, 184, .12); }
      .wide { grid-column: 1 / -1; }
      .actions { display: flex; justify-content: flex-end; gap: 10px; }
      button { padding: 11px 18px; border: 0; border-radius: 8px; font-weight: 700; }
      .secondary { color: #445581; background: #edf0f7; }
      .primary { color: white; background: #5367ac; }
      .notice { margin-bottom: 18px; padding: 12px 14px; border-left: 3px solid #d99b38; color: #705929; background: #fff8e9; font-size: 13px; }
      .widget-wrap { position: relative; }
      .cascader-panel, .date-panel { position: absolute; z-index: 20; top: 68px; left: 0; padding: 10px; border: 1px solid #d8dbe5; border-radius: 10px; background: white; box-shadow: 0 12px 30px rgba(31, 42, 78, .18); }
      .cascader-panel { display: none; width: 430px; grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .cascader-panel.open { display: grid; }
      .cascader-panel ul { min-height: 120px; margin: 0; padding: 0; border-right: 1px solid #eceef4; list-style: none; }
      .cascader-panel li { padding: 8px; border-radius: 6px; cursor: pointer; }
      .cascader-panel li:hover, .cascader-panel li[aria-selected="true"] { color: #43589d; background: #edf1ff; }
      .date-panel { display: none; width: 300px; }
      .date-panel.open { display: block; }
      .calendar-header { display: grid; grid-template-columns: 36px 36px 1fr 36px 36px; align-items: center; gap: 4px; margin-bottom: 8px; }
      .calendar-header button { padding: 7px 4px; }
      .calendar-title { text-align: center; font-weight: 700; }
      .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
      .calendar-grid button { padding: 7px 3px; background: #f5f6fa; }
      @media (max-width: 620px) { .grid { grid-template-columns: 1fr; } .wide { grid-column: auto; } form { padding: 20px; } }
    </style>
  </head>
  <body>
    <header><h1>研究生报考服务系统 · 演示页</h1><p>用于本地测试 FormPilot，不会向服务器发送数据</p></header>
    <main>
      <div class="notice">此页面只用于测试 Python Agent，包括原生下拉、三级籍贯和需要翻年/月的自定义日历。</div>
      <form id="applicationForm">
        <fieldset>
          <legend>基本信息</legend>
          <div class="grid">
            <label for="xm">姓名<input id="xm" name="xm" placeholder="请输入真实姓名" autocomplete="name"></label>
            <label for="zjlx">证件类型<select id="zjlx" name="zjlx"><option value="">--请选择--</option><option value="01">居民身份证</option><option value="03">港澳台身份证</option><option value="04">华侨身份证</option></select></label>
            <label class="wide" for="zjhm">证件号码<input id="zjhm" name="zjhm" autocomplete="off"></label>
            <label for="yddh">手机号码<input id="yddh" name="yddh" type="tel" autocomplete="tel"></label>
            <label for="email">电子邮箱<input id="email" name="email" type="email" autocomplete="email"></label>
            <label class="wide" for="txdz">通信地址<input id="txdz" name="txdz" autocomplete="street-address"></label>
          </div>
        </fieldset>
        <fieldset>
          <legend>教育与报考信息</legend>
          <div class="grid">
            <label for="school">毕业院校<input id="school" name="school"></label>
            <label for="major">本科专业<input id="major" name="major"></label>
            <label for="project">招生项目<select id="project" name="project"><option value="">--请选择--</option><option>博士研究生招生</option><option>硕士研究生招生</option><option>全国优秀大学生夏令营</option></select></label>
            <label for="batch">招生批次<select id="batch" name="batch"><option value="">--请先选择招生项目--</option></select></label>
            <label for="mode">招生方式<select id="mode" name="mode"><option value="">--请先选择招生批次--</option></select></label>
            <label class="widget-wrap" for="nativePlace">籍贯
              <input id="nativePlace" name="nativePlace" role="combobox" aria-haspopup="tree" readonly placeholder="请选择省/市/区">
              <div id="originPanel" class="cascader-panel" role="tree" aria-label="籍贯选择">
                <ul id="provinceOptions" role="group"><li role="option">浙江省</li><li role="option">江苏省</li></ul>
                <ul id="cityOptions" role="group"></ul>
                <ul id="districtOptions" role="group"></ul>
              </div>
            </label>
            <label class="widget-wrap" for="enrollmentDate">入学时间
              <input id="enrollmentDate" name="enrollmentDate" role="combobox" aria-haspopup="dialog" readonly placeholder="请选择日期">
              <div id="datePanel" class="date-panel" role="dialog" aria-label="入学日期选择">
                <div id="calendarHeader" class="calendar-header" data-current-year="2026" data-current-month="9">
                  <button type="button" aria-label="上一年">&lt;&lt;</button>
                  <button type="button" aria-label="上一月">&lt;</button>
                  <span id="calendarTitle" class="calendar-title"></span>
                  <button type="button" aria-label="下一月">&gt;</button>
                  <button type="button" aria-label="下一年">&gt;&gt;</button>
                </div>
                <div id="calendarGrid" class="calendar-grid" role="grid"></div>
              </div>
            </label>
            <label for="captcha">验证码<input id="captcha" name="captcha" placeholder="必须由用户填写"></label>
          </div>
        </fieldset>
        <div class="actions"><button type="button" class="secondary">保存草稿</button><button type="submit" class="primary">提交报名</button></div>
      </form>
    </main>
    <script>
      const project = document.getElementById("project");
      const batch = document.getElementById("batch");
      const mode = document.getElementById("mode");
      project.addEventListener("change", () => {
        batch.innerHTML = project.value ? '<option value="">--请选择--</option><option>2026年秋季批次</option><option>2026年春季批次</option>' : '<option value="">--请先选择招生项目--</option>';
        mode.innerHTML = '<option value="">--请先选择招生批次--</option>';
      });
      batch.addEventListener("change", () => {
        mode.innerHTML = batch.value ? '<option value="">--请选择--</option><option>普通招考</option><option>硕博连读</option>' : '<option value="">--请先选择招生批次--</option>';
      });
      const nativePlace = document.getElementById("nativePlace");
      const originPanel = document.getElementById("originPanel");
      const cityOptions = document.getElementById("cityOptions");
      const districtOptions = document.getElementById("districtOptions");
      let selectedProvince = "";
      let selectedCity = "";
      nativePlace.addEventListener("click", () => originPanel.classList.add("open"));
      document.getElementById("provinceOptions").addEventListener("click", (event) => {
        if (event.target.getAttribute("role") !== "option") return;
        selectedProvince = event.target.textContent;
        event.target.setAttribute("aria-selected", "true");
        cityOptions.innerHTML = selectedProvince === "浙江省" ? '<li role="option">杭州市</li><li role="option">温州市</li>' : '<li role="option">南京市</li>';
        districtOptions.innerHTML = "";
      });
      cityOptions.addEventListener("click", (event) => {
        if (event.target.getAttribute("role") !== "option") return;
        selectedCity = event.target.textContent;
        event.target.setAttribute("aria-selected", "true");
        districtOptions.innerHTML = selectedCity === "温州市" ? '<li role="option">鹿城区</li><li role="option">瑞安市</li>' : '<li role="option">西湖区</li>';
      });
      districtOptions.addEventListener("click", (event) => {
        if (event.target.getAttribute("role") !== "option") return;
        nativePlace.value = `${selectedProvince}/${selectedCity}/${event.target.textContent}`;
        nativePlace.dispatchEvent(new Event("change", {bubbles: true}));
        originPanel.classList.remove("open");
      });

      const enrollmentDate = document.getElementById("enrollmentDate");
      const datePanel = document.getElementById("datePanel");
      const calendarHeader = document.getElementById("calendarHeader");
      const calendarTitle = document.getElementById("calendarTitle");
      const calendarGrid = document.getElementById("calendarGrid");
      let calendarYear = 2026;
      let calendarMonth = 9;
      function renderCalendar() {
        calendarHeader.dataset.currentYear = String(calendarYear);
        calendarHeader.dataset.currentMonth = String(calendarMonth);
        calendarTitle.textContent = `${calendarYear}年${calendarMonth}月`;
        const days = new Date(calendarYear, calendarMonth, 0).getDate();
        calendarGrid.innerHTML = Array.from({length: days}, (_, index) => {
          const day = index + 1;
          const iso = `${calendarYear}-${String(calendarMonth).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
          return `<button type="button" role="gridcell" data-date="${iso}" title="${iso}">${day}</button>`;
        }).join("");
      }
      function moveMonth(delta) {
        calendarMonth += delta;
        if (calendarMonth < 1) { calendarMonth = 12; calendarYear -= 1; }
        if (calendarMonth > 12) { calendarMonth = 1; calendarYear += 1; }
        renderCalendar();
      }
      enrollmentDate.addEventListener("click", () => datePanel.classList.add("open"));
      calendarHeader.querySelector('[aria-label="上一年"]').addEventListener("click", () => { calendarYear -= 1; renderCalendar(); });
      calendarHeader.querySelector('[aria-label="下一年"]').addEventListener("click", () => { calendarYear += 1; renderCalendar(); });
      calendarHeader.querySelector('[aria-label="上一月"]').addEventListener("click", () => moveMonth(-1));
      calendarHeader.querySelector('[aria-label="下一月"]').addEventListener("click", () => moveMonth(1));
      calendarGrid.addEventListener("click", (event) => {
        const value = event.target.getAttribute("data-date");
        if (!value) return;
        enrollmentDate.value = value;
        enrollmentDate.dispatchEvent(new Event("change", {bubbles: true}));
        datePanel.classList.remove("open");
      });
      renderCalendar();
      document.getElementById("applicationForm").addEventListener("submit", (event) => {
        event.preventDefault();
        alert("演示页不会提交数据。FormPilot 也不会点击此按钮。");
      });
    </script>
  </body>
</html>
