name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python package
        run: pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests_python -v
      - name: Compile Python package
        run: python -m compileall -q formpilot
      - name: Check CLI entry point
        run: formpilot --help
