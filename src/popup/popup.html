<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FormPilot</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header class="topbar">
      <div class="brand-mark">F</div>
      <div>
        <h1>FormPilot</h1>
        <p>本地、安全、提交前确认</p>
      </div>
      <span class="local-badge">本地</span>
    </header>

    <main>
      <section class="site-card">
        <div>
          <span class="eyebrow">当前页面</span>
          <strong id="siteName">正在连接…</strong>
          <small id="siteOrigin"></small>
        </div>
        <button id="scanButton" class="icon-button" title="重新扫描" aria-label="重新扫描">↻</button>
      </section>

      <details class="profile-card">
        <summary>
          <span><b>个人资料</b><small id="profileSummary">填写后仅保存在此浏览器</small></span>
          <span class="chevron">⌄</span>
        </summary>
        <div class="profile-grid" id="profileForm">
          <label>姓名<input data-path="identity.full_name_zh" autocomplete="name"></label>
          <label>证件类型<input data-path="identity.document_type" placeholder="如：居民身份证"></label>
          <label class="wide">证件号码<input data-path="identity.document_number" autocomplete="off"></label>
          <label>性别<input data-path="identity.gender"></label>
          <label>出生日期<input data-path="identity.birth_date" type="date"></label>
          <label>手机号码<input data-path="contact.mobile" autocomplete="tel"></label>
          <label>电子邮箱<input data-path="contact.email" type="email" autocomplete="email"></label>
          <label class="wide">通信地址<input data-path="contact.address" autocomplete="street-address"></label>
          <label>毕业/在读院校<input data-path="education.school"></label>
          <label>所学专业<input data-path="education.major"></label>
          <label>学位<input data-path="education.degree"></label>
          <label>毕业日期<input data-path="education.graduation_date" type="date"></label>
          <label>招生项目<input data-path="application.project"></label>
          <label>招生批次<input data-path="application.batch"></label>
          <label>招生方式<input data-path="application.mode"></label>
          <label>报考专业<input data-path="application.program"></label>
        </div>
        <p class="privacy-note">密码、验证码、协议确认及最终提交始终由你处理。</p>
      </details>

      <section class="results-section">
        <div class="section-heading">
          <div><span class="eyebrow">填写计划</span><h2 id="resultTitle">等待扫描</h2></div>
          <span id="readyCount" class="count-badge">0</span>
        </div>
        <div id="resultList" class="result-list" aria-live="polite">
          <div class="empty-state">打开一个表单页面，FormPilot 会识别可填写字段。</div>
        </div>
      </section>
    </main>

    <footer>
      <div id="statusText" class="status-text">不会点击“提交”按钮</div>
      <button id="fillButton" class="primary-button" disabled>确认并填写 <span>→</span></button>
    </footer>

    <script src="../core/formpilot-core.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
